notes: >-
  Clair's partner integration model is component-first rather than API-first for the
  end-user surface: partners send employee/employment/attendance data over the partner
  REST API, then embed a Clair-hosted user experience so employees can take an advance,
  review history, make repayments and handle loan servicing. Embedding the hosted
  component is how partners avoid becoming a licensed loan servicer themselves. The
  component families below are the ones Clair distributes publicly; the web/WebView
  embed itself is documented only inside the partner program.
