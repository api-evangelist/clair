aid: clair
name: Clair
description: 'Clair Inc is a New York-based financial technology company that provides
  free, compliant On-Demand Pay (earned wage access) as an embedded service inside
  the payroll, time-and-attendance and workforce-management platforms employees already
  use. Rather than selling a consumer app, Clair partners with platforms — Gusto Embedded
  Payroll, Check, 7shifts and others — and connects to them over a partner REST API
  that transmits employee, employment and attendance data, which Clair''s underwriting
  engine uses to originate 0% APR earned wage advances through its FDIC-insured partner
  bank, Pathward N.A. Partners embed a Clair-hosted user experience (a WebView component,
  distributed for iOS as Swift packages) so employees can take an advance, review history
  and handle loan servicing without a separate login. Clair has raised roughly $218M
  in total capital, including a $23.2M Series B in May 2025.'
